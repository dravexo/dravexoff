<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {
      background-color: #202028;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #f1c40f; }
    .content {
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.6;
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 10px;

    button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
    }
    button:hover { background-color: #c0392b; }

<body>
  <h1>PRIVACY POLICY</h1>
  <div class="content">
    <p><strong>Data Collection:</strong> This game stores your progress (levels, high score, settings) locally on your device using LocalStorage.</p>
    <p><strong>Third Parties:</strong> No personal data is collected, transmitted, or shared with third parties.</p>
    <p><strong>Contact:</strong> This is a fan-made game. Enjoy!</p>
  </div>
  <button onclick="window.location.href='index.html'">BACK TO GAME</button>
